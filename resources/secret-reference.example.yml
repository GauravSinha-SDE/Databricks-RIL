# Illustrative job configuration only; merge into jobs.yml if needed.
# Scope/key are references. Secret values must live in the cloud secret manager.
resources:
  jobs:
    source_secret_consumer:
      name: ${bundle.name}-${bundle.target}-secret-consumer
      tasks:
        - task_key: consume_secret
          notebook_task:
            notebook_path: ../src/platform/secret_reference.py
            base_parameters:
              scope: ${var.secret_scope}
              key: source-api-token

