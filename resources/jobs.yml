resources:
  jobs:
    medallion_ingestion:
      name: ${bundle.name}-${bundle.target}-medallion-ingestion
      tasks:
        - task_key: bronze_ingest
          python_wheel_task:
            package_name: databricks_platform
            entry_point: ingest_bronze
            parameters:
              - --catalog
              - ${var.catalog_name}
          job_cluster_key: shared_job_cluster
          libraries:
            - whl: ../dist/*.whl
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          python_wheel_task:
            package_name: databricks_platform
            entry_point: transform_silver
            parameters:
              - --catalog
              - ${var.catalog_name}
          job_cluster_key: shared_job_cluster
          libraries:
            - whl: ../dist/*.whl
        - task_key: gold_publish
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: databricks_platform
            entry_point: publish_gold
            parameters:
              - --catalog
              - ${var.catalog_name}
          job_cluster_key: shared_job_cluster
          libraries:
            - whl: ../dist/*.whl
      run_as:
        service_principal_name: ${var.service_principal_application_id}
      schedule:
        quartz_cron_expression: 0 0/30 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: shared_job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            autoscale:
              min_workers: 1
              max_workers: ${var.max_workers}
            data_security_mode: USER_ISOLATION
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: data-platform-operators
        - level: CAN_VIEW
          group_name: data-platform-readers
