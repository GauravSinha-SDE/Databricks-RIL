resources:
  clusters:
    platform_job_cluster:
      cluster_name: ${bundle.name}-${bundle.target}-job
      spark_version: 15.4.x-scala2.12
      node_type_id: ${var.node_type_id}
      autoscale:
        min_workers: 1
        max_workers: ${var.max_workers}
      data_security_mode: USER_ISOLATION
      runtime_engine: PHOTON
      autotermination_minutes: 20
      custom_tags:
        environment: ${bundle.target}
        managed_by: databricks_asset_bundles
    platform_sql_warehouse:
      name: ${bundle.name}-${bundle.target}-sql
      cluster_size: ${var.warehouse_size}
      min_num_clusters: 1
      max_num_clusters: ${var.warehouse_max_clusters}
      auto_stop_mins: 15
      enable_serverless_compute: true

